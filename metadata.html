<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Metadata</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 20px;
        }
        h1 {
            color: #333;
        }
        table {
            width: 50%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th, td {
            padding: 12px;
            text-align: left;
        }
    </style>
</head>
<body>
    <h1>Metadata for: {{ filename }}</h1>
    {% if metadata %}
        <table>
            <tr>
                <th>Attribute</th>
                <th>Value</th>
            </tr>
            <tr>
                <td>File Size (bytes)</td>
                <td>{{ metadata.size }}</td>
            </tr>
            <tr>
                <td>Last Modified</td>
                <td>{{ metadata.last_modified }}</td>
            </tr>
            <tr>
                <td>Created</td>
                <td>{{ metadata.created }}</td>
            </tr>
        </table>
    {% else %}
        <p>No metadata available for this file.</p>
    {% endif %}
</body>
</html>
